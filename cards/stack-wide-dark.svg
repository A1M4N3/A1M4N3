<svg xmlns="http://www.w3.org/2000/svg" width="880" height="518" viewBox="0 0 880 518" role="img" aria-labelledby="t"><title id="t">The stack, screen to server. Mobile: React Native, Expo, Xcode (iOS and Android apps, shipped to both stores). TV &amp; devices: Android TV, Android SDK (Ten-foot interfaces built for the remote, IoT ambient-light control). Web: Next.js, React, Tailwind, TypeScript (Multilingual storefronts with payments, customer portals, SEO-driven sites). Services: Node, Bun, Fastify, Medusa (SaaS and commerce APIs, auth, payments, background jobs). Data: PostgreSQL, Redis, MySQL, Prisma, Drizzle (Schema design, migrations, nightly backups with tested restores). Infrastructure: Debian, Docker, Caddy, Cloudflare, Stalwart (Self-hosted containers, TLS, DNS and mail). Workflow: Claude Code, Codex, MCP (Agent-assisted, with tests and review on every change).</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}</style><text x="0" y="22" font-size="20" fill="#e6edf3" font-weight="600">Screen to server</text><line x1="0" y1="46" x2="880" y2="46" stroke="#30363d"/><text x="0" y="75" font-size="16" fill="#e6edf3" font-weight="600">Mobile</text><text x="152" y="75" font-size="16" fill="#e6edf3">React Native</text><text x="267.8" y="75" font-size="16" fill="#e6edf3">Expo</text><text x="326.6" y="75" font-size="16" fill="#e6edf3">Xcode</text><text x="152" y="98" font-size="14" fill="#9198a1">iOS and Android apps, shipped to both stores</text><line x1="0" y1="110" x2="880" y2="110" stroke="#30363d"/><text x="0" y="139" font-size="16" fill="#e6edf3" font-weight="600">TV &amp; devices</text><text x="152" y="139" font-size="16" fill="#e6edf3">Android TV</text><text x="256.9" y="139" font-size="16" fill="#e6edf3">Android SDK</text><text x="152" y="162" font-size="14" fill="#9198a1">Ten-foot interfaces built for the remote, IoT ambient-light control</text><line x1="0" y1="174" x2="880" y2="174" stroke="#303