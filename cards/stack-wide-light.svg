<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" role="img" aria-labelledby="t"><title id="t">The stack, screen to server. Apps: React Native, Expo (IPTV player, driving-theory exam app, field-service app). Web: React, Next.js, Tailwind, TypeScript (Multilingual webshop, customer portals, client sites). Services: Node, Bun, Fastify, Medusa (The APIs behind every product). Data: PostgreSQL, Redis, MySQL, Prisma, Drizzle (Migrations, nightly backups, tested restores). Server: Debian, Docker, Caddy, Cloudflare, Stalwart mail (One server, run end to end). Agents on every layer: Claude Code, Codex, MCP.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}</style><text x="0" y="22" font-size="20" fill="#1f2328" font-weight="600">Screen to server</text><line x1="0" y1="46" x2="672" y2="46" stroke="#d0d7de"/><text x="0" y="75" font-size="16" fill="#1f2328" font-weight="600">Apps</text><text x="128" y="75" font-size="16" fill="#1f2328">React Native</text><text x="243.8" y="75" font-size="16" fill="#1f2328">Expo</text><text x="128" y="98" font-size="14" fill="#59636e">IPTV player, driving-theory exam app, field-service app</text><line x1="680" y1="69.5" x2="700" y2="69.5" stroke="#C77A12" stroke-width="1.5"/><line x1="0" y1="114" x2="672" y2="114" stroke="#d0d7de"/><text x="0" y="143" font-size="16" fill="#1f2328" font-weight="600">Web</text><text x="128" y="143" font-size="16" fill="#1f2328">React</text><text x="191.4" y="143" font-size="16" fill="#1f2328">Next.js</text><text x="264.9" y="143" font-size="16" fill="#1f2328">Tailwind</text><text x="349.5" y="143" font-size="16" fill="#1f2328">TypeScript</text><text x="128" y="166" font-size="14" fill="#59636e">Multilingual webshop, customer portals, client sites</text><line x1="680" y1="137.5" x2="700" y2="137.5" stroke="#C77A12" stroke-width="1.5"/><line x1="0" y1="182" x2="672" y2="182" stroke="#d0d7de"/><text x="0" y="211" fo