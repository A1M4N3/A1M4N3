<svg xmlns="http://www.w3.org/2000/svg" width="480" height="709" viewBox="0 0 480 709" role="img" aria-labelledby="t"><title id="t">The stack, screen to server. Mobile: React Native, Expo, Xcode (iOS and Android apps, shipped to both stores). TV &amp; devices: Android TV, Android SDK (Ten-foot interfaces built for the remote, IoT ambient-light control). Web: Next.js, React, Tailwind, TypeScript (Multilingual storefronts with payments, customer portals, SEO-driven sites). Services: Node, Bun, Fastify, Medusa (SaaS and commerce APIs, auth, payments, background jobs). Data: PostgreSQL, Redis, MySQL, Prisma, Drizzle (Schema design, migrations, nightly backups with tested restores). Infrastructure: Debian, Docker, Caddy, Cloudflare, Stalwart (Self-hosted containers, TLS, DNS and mail). Workflow: Claude Code, Codex, MCP (Agent-assisted, with tests and review on every change).</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}</style><text x="0" y="20" font-size="18" fill="#1f2328" font-weight="600">Screen to server</text><line x1="0" y1="40" x2="480" y2="40" stroke="#d0d7de"/><text x="0" y="67" font-size="16" fill="#1f2328" font-weight="600">Mobile</text><text x="0" y="91" font-size="16" fill="#1f2328">React Native</text><text x="111.8" y="91" font-size="16" fill="#1f2328">Expo</text><text x="166.6" y="91" font-size="16" fill="#1f2328">Xcode</text><text x="0" y="113" font-size="14" fill="#59636e">iOS and Android apps, shipped to both stores</text><line x1="0" y1="129" x2="480" y2="129" stroke="#d0d7de"/><text x="0" y="156" font-size="16" fill="#1f2328" font-weight="600">TV &amp; devices</text><text x="0" y="180" font-size="16" fill="#1f2328">Android TV</text><text x="100.9" y="180" font-size="16" fill="#1f2328">Android SDK</text><text x="0" y="202" font-size="14" fill="#59636e">Ten-foot interfaces built for the remote, IoT ambient-light control</text><line x1="0" y1="218" x2="480" y2="218" stroke="#d0d7de"/><