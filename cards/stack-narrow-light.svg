<svg xmlns="http://www.w3.org/2000/svg" width="480" height="605" viewBox="0 0 480 605" role="img" aria-labelledby="t"><title id="t">The stack, screen to server. Apps: React Native, Expo (IPTV player, driving-theory exam app, field-service app). Web: React, Next.js, Tailwind, TypeScript (Multilingual webshop, customer portals, client sites). Services: Node, Bun, Fastify, Medusa (The APIs behind every product). Data: PostgreSQL, Redis, MySQL, Prisma, Drizzle (Migrations, nightly backups, tested restores). Server: Debian, Docker, Caddy, Cloudflare, Stalwart mail (One server, run end to end). Agents on every layer: Claude Code, Codex, MCP.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}</style><text x="0" y="20" font-size="18" fill="#1f2328" font-weight="600">Screen to server</text><text x="22" y="67" font-size="16" fill="#1f2328" font-weight="600">Apps</text><text x="22" y="91" font-size="16" fill="#1f2328">React Native</text><text x="133.8" y="91" font-size="16" fill="#1f2328">Expo</text><text x="22" y="113" font-size="14" fill="#59636e">IPTV player, driving-theory exam app, field-service app</text><line x1="22" y1="129" x2="480" y2="129" stroke="#d0d7de"/><text x="22" y="156" font-size="16" fill="#1f2328" font-weight="600">Web</text><text x="22" y="180" font-size="16" fill="#1f2328">React</text><text x="81.4" y="180" font-size="16" fill="#1f2328">Next.js</text><text x="150.9" y="180" font-size="16" fill="#1f2328">Tailwind</text><text x="231.5" y="180" font-size="16" fill="#1f2328">TypeScript</text><text x="22" y="202" font-size="14" fill="#59636e">Multilingual webshop, customer portals, client sites</text><line x1="22" y1="218" x2="480" y2="218" stroke="#d0d7de"/><text x="22" y="245" font-size="16" fill="#1f2328" font-weight="600">Services</text><text x="22" y="269" font-size="16" fill="#1f2328">Node</text><text x="80.7" y="269" font-size="16" fill="#1f2328">Bun</text><text x="128.9" y="269" font-size